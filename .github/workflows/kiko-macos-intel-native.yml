name: Kiko remaining Intel Mac native binary acceptance
on:
  push:
    branches: [kiko-0316-binary-qa]
    paths:
      - .github/workflows/kiko-macos-intel-native.yml
      - scripts/kiko_macos_intel_native.py
permissions:
  contents: read
concurrency:
  group: kiko-0316-remaining-native
  cancel-in-progress: false
jobs:
  macos-intel-native:
    if: github.repository == 'liudingshu/liudingshu.github.io' && github.event.repository.private == false
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/kiko_macos_intel_native.py
            scripts/kiko_linux_arm_native.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free external binary QA dependencies
        run: python -m pip install 'pyinstaller==6.16.0' 'pydantic>=2,<3' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psutil>=6,<8' 'requests>=2.32,<3'
      - name: Original15 to16 native Intel install recovery and newest reopen
        env:
          KIKO_NATIVE_QA_DOWNLOADS: ${{ secrets.KIKO_NATIVE_QA_DOWNLOADS }}
          KIKO_MAC_BASELINE_ASSET: '656071159'
        run: python scripts/kiko_macos_intel_native.py
      - name: Preserve native receipts and synthetic evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiko-native-macos-x64-0316
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kiko-intel-native16/evidence/**
            ${{ runner.temp }}/kiko-intel-native16/fixture/data/**/*.json
            ${{ runner.temp }}/kiko-intel-native16/fixture/data/**/*.db
