name: Kiko remaining Linux ARM64 native binary acceptance
on:
  push:
    branches: [kiko-0316-binary-qa]
    paths:
      - .github/workflows/kiko-linux-arm-native.yml
      - scripts/kiko_linux_arm_native.py
permissions:
  contents: read
concurrency:
  group: kiko-0316-remaining-native
  cancel-in-progress: false
jobs:
  linux-arm-native:
    if: github.repository == 'liudingshu/liudingshu.github.io' && github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/kiko_linux_arm_native.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free native QA runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libwebkit2gtk-4.1-0
          python -m pip install 'pyinstaller==6.16.0' 'pydantic>=2,<3' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'psutil>=6,<8' 'requests>=2.32,<3'
      - name: Exact original15 to16 installation recovery and real native reopen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIKO_BASELINE_ASSET: '655657525'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python scripts/kiko_linux_arm_native.py
      - name: Keep bounded original receipts and synthetic fixture evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiko-native-linux-arm64-0316
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kiko-arm-native16/evidence/**
            ${{ runner.temp }}/kiko-arm-native16/fixture/data/**/*.json
            ${{ runner.temp }}/kiko-arm-native16/fixture/data/**/*.db
