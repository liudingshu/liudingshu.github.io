name: Publish Kayu release assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets from short-lived URLs
        shell: bash
        env:
          WINDOWS_URL: ${{ secrets.KAYU_ASSET_WINDOWS_X64 }}
          MACOS_ARM64_URL: ${{ secrets.KAYU_ASSET_MACOS_ARM64 }}
          MACOS_X64_URL: ${{ secrets.KAYU_ASSET_MACOS_X64 }}
          LINUX_X64_URL: ${{ secrets.KAYU_ASSET_LINUX_X64 }}
          LINUX_ARM64_URL: ${{ secrets.KAYU_ASSET_LINUX_ARM64 }}
          CHECKSUMS_URL: ${{ secrets.KAYU_ASSET_CHECKSUMS }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          curl --fail --location --retry 5 --retry-all-errors "$WINDOWS_URL" -o release-assets/KayuSetup-windows-x64.exe &
          curl --fail --location --retry 5 --retry-all-errors "$MACOS_ARM64_URL" -o release-assets/KayuLocalAssistant-macos-arm64.dmg &
          curl --fail --location --retry 5 --retry-all-errors "$MACOS_X64_URL" -o release-assets/KayuLocalAssistant-macos-x64.dmg &
          curl --fail --location --retry 5 --retry-all-errors "$LINUX_X64_URL" -o release-assets/KayuLocalAssistant-linux-x64.tar.gz &
          curl --fail --location --retry 5 --retry-all-errors "$LINUX_ARM64_URL" -o release-assets/KayuLocalAssistant-linux-arm64.tar.gz &
          curl --fail --location --retry 5 --retry-all-errors "$CHECKSUMS_URL" -o release-assets/SHA256SUMS.txt &
          wait
      - name: Verify release checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload public release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload desktop-v0.2.1 release-assets/* --clobber